name: Publish Packages to NPM

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer package version to publish'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci # Installs dependencies for the entire workspace

      - name: Build ai_licia-client package
        run: npm run build --workspace=packages/ai_licia-client --if-present

      - name: Resolve publication version
        id: get_version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          node -e "const version = process.argv[1]; if (!/^\\d+\\.\\d+\\.\\d+$/.test(version)) process.exit(1)" "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update version in ai_licia-client package.json
        run: |
          cd packages/ai_licia-client
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Updated ai_licia-client to version $VERSION"
        
      - name: Publish ai_licia-client package
        run: npm publish --workspace=packages/ai_licia-client --access public
